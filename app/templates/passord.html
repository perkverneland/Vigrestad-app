{% extends "base.html" %}
{% block tittel %}Bytt passord{% endblock %}
{% block innhold %}
<div class="kort smal">
  <h1>Bytt passord</h1>
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>Nåværende passord <input name="gammelt" type="password" required></label>
    <label>Nytt passord <input name="nytt" type="password" required></label>
    <label>Nytt passord en gang til <input name="nytt2" type="password" required></label>
    <button class="stor">Lagre</button>
  </form>
</div>
{% endblock %}
